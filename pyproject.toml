[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbodocs"
version = "1.0.0"
description = "A pageless, themeable word processor with .docx support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "python-docx>=1.1"]

[project.scripts]
turbodocs = "turbodocs.app:main"

[tool.setuptools]
packages = ["turbodocs"]

[tool.setuptools.package-data]
turbodocs = ["resources/*.svg", "resources/fonts/*"]
